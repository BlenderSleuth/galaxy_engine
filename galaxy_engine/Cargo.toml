[package]
name = "galaxy_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.81.0"

[features]
default = ["debug"]
debug = ["ash/debug"]

[dependencies]
ash = { version = "0.38.0", default-features = false, features = ["loaded"] }
ash-window = "0.13.0"
raw-window-handle = "0.6.2"
winit = "0.30.5"
bitflags = "2.6.0"
log = "0.4.0"
env_logger = "0.11.5"
thiserror = "1.0.64"
nalgebra-glm = "0.19.0"
